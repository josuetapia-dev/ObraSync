<ion-tabs>

  <ion-tab-bar slot="bottom" id="tab-bar">
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon aria-hidden="true" name="cart-outline"></ion-icon>
      <ion-label>Vender</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2" href="/tabs/tab2">
      <ion-icon aria-hidden="true" name="receipt-outline"></ion-icon>
      <ion-label>Ventas</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" name="sync-outline"></ion-icon>
      <ion-label>Sincronizar</ion-label>
      @if (estado.pendientes() > 0) {
        <ion-badge color="warning" [attr.aria-label]="estado.pendientes() + ' ventas pendientes'">{{ estado.pendientes() }}</ion-badge>
      }
    </ion-tab-button>
  </ion-tab-bar>

</ion-tabs>
